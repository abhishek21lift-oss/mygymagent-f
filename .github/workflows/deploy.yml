name: Deploy Frontend

on:
  # Only a main commit that passed CI goes live. Deploying on `push` ran
  # in parallel with CI, so a commit that failed its checks still shipped.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual redeploy of main's current commit (Actions → Deploy Frontend).
  workflow_dispatch:

concurrency:
  group: mygymagent-frontend-production
  # Never stop a deploy halfway (between build and restart); a newer one
  # waits its turn instead.
  cancel-in-progress: false

# The jobs only read the repository; nothing here needs a token that can
# write to it.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Frontend to VPS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          # Set VPS_HOST_FINGERPRINT (ssh-keygen -l -f on the VPS host key) to
          # refuse a host that is not the VPS; empty, the check is skipped.
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script: |
            set -eu

            cd /opt/thecultclient/mygymagent-f

            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              # CI for an older commit finished after a newer one landed:
              # the newer commit's own deploy ships it once its CI passes.
              echo "$DEPLOY_SHA is no longer main's latest commit; skipping"
              exit 0
            fi
            git reset --hard "$DEPLOY_SHA"

            cd /opt/thecultclient

            docker compose build frontend
            docker compose up -d --no-deps --force-recreate frontend

            # Wait up to 2 minutes for the server to answer.
            healthy=0
            for attempt in $(seq 1 24); do
              if curl -fsSI --max-time 5 http://127.0.0.1:3200 >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" != 1 ]; then
              echo "Frontend did not come up; last logs:"
              docker compose logs --tail=200 frontend || true
              exit 1
            fi

            docker image prune -f >/dev/null 2>&1 || true

            echo "Frontend deployment successful ($DEPLOY_SHA)"
