name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-apk-capacitor
      - fix/android-apk-ci
  pull_request:
    paths:
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare Capacitor assets directory
        run: mkdir -p android/app/src/main/assets

      # Push needs the Firebase project's google-services.json. Store it as
      # the GOOGLE_SERVICES_JSON repository secret (raw JSON or base64).
      # Without it the APK is built without the push plugin, and the app
      # says push is unavailable rather than offering a button that fails.
      # Must run before `cap sync`, which decides which plugins go in.
      - name: Configure push notifications
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            node scripts/android-push.mjs enable
          else
            echo "::notice title=Push disabled::GOOGLE_SERVICES_JSON is not set, so this APK is built without push notifications."
            node scripts/android-push.mjs disable
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyGymAgent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
