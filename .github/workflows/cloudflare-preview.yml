name: Cloudflare Preview Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview-deploy:
    name: Deploy Preview to Cloudflare Workers
    # Disabled until the Cloudflare account exists: no CF_API_TOKEN /
    # CF_ACCOUNT_ID secret is configured and `cloudflare/wrangler-action`
    # has no `v2` tag, so this job could only ever fail. Re-enable
    # (remove this line, add the secrets, pin the action) when the
    # preview Worker is actually set up.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      # Build-time variables for Next.js (inlined into the client bundle)
      NEXT_PUBLIC_API_URL: https://preview-api.my-gym-agent.com
      NEXT_PUBLIC_SITE_URL: https://preview.my-gym-agent.com
      # Optional: other NEXT_PUBLIC_* variables from .env.local.example
      NEXT_PUBLIC_META_APP_ID: ""
      NEXT_PUBLIC_META_WHATSAPP_CONFIG_ID: ""
      NEXT_PUBLIC_WHATSAPP_GRAPH_VERSION: "v25.0"
      NEXT_PUBLIC_FIREBASE_API_KEY: ""
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
      NEXT_PUBLIC_FIREBASE_APP_ID: ""
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ""
      NEXT_PUBLIC_LEGAL_ENTITY_NAME: ""
      NEXT_PUBLIC_LEGAL_ADDRESS: ""
      NEXT_PUBLIC_LEGAL_SUPPORT_EMAIL: ""
      NEXT_PUBLIC_LEGAL_SUPPORT_PHONE: ""
      NEXT_PUBLIC_LEGAL_GRIEVANCE_OFFICER_NAME: ""
      NEXT_PUBLIC_LEGAL_GRIEVANCE_OFFICER_EMAIL: ""
      NEXT_PUBLIC_LEGAL_JURISDICTION_CITY: ""
      NEXT_PUBLIC_LEGAL_EFFECTIVE_DATE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Publish to Cloudflare Preview
        uses: cloudflare/wrangler-action@v2
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .opennext
          environment: preview
